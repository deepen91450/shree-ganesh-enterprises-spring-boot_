<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ✅ CSRF META TAGS -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <!-- In <head>, last CSS -->
    <link rel="stylesheet" href="/css/animations.css">
    <!-- HEADER + NAV -->
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/navbar.css">

    <!-- FOOTER -->
    <link rel="stylesheet" href="/css/footer.css">

    <!-- CART SPECIFIC CSS -->
    <link rel="stylesheet" href="/css/cart.css">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="cart-page">

    <h2>Your Cart</h2>

    <div th:if="${#lists.size(cart) > 0}">

        <table class="cart-table">
            <thead>
            <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="item : ${cart}" th:attr="data-row-id=${item.productId}">

                <td>
                    <a th:href="@{/product/{id}(id=${item.productId})}" target="_blank">
                        <img th:src="${item.imagePath}"
                             class="cart-product-img"
                             alt="Product">
                    </a>
                </td>

                <td>
                    <a th:href="@{/product/{id}(id=${item.productId})}"
                       target="_blank"
                       class="cart-product-link"
                       th:text="${item.name}">
                    </a>
                </td>

                <td data-price th:text="${item.price}"></td>

                <td>
                    <div class="qty-box">
                        <button class="qty-btn minus">-</button>
                        <span class="qty-value" th:text="${item.quantity}"></span>
                        <button class="qty-btn plus">+</button>
                    </div>
                </td>

                <td data-total th:text="${item.price * item.quantity}"></td>

                <td>
                    <button class="remove-btn">Remove</button>
                </td>

            </tr>
            </tbody>
        </table>

        <h3 class="grand-total">
            Total: ₹ <span id="grandTotal" th:text="${total}"></span>
        </h3>

        <!-- ✅ FIXED FORM -->
        <form th:action="@{/cart/enquiry}" method="post" class="enquiry-form">

            <!-- CSRF TOKEN -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <textarea name="message" placeholder="Add a message (optional)..."></textarea>

            <button type="submit" class="btn-enquiry" id="sendEnquiryBtn">
                Send Enquiry
            </button>
        </form>

    </div>

    <div th:if="${#lists.isEmpty(cart)}" class="empty-cart-wrapper">
        <div class="empty-cart">
            <h3>Your cart is empty 🛍️</h3>
            <p>Add products to continue.</p>
            <a href="/products" class="btn-enquiry">Browse Products</a>
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<!-- CART JAVASCRIPT -->
<script>

    // ✅ CSRF TOKEN FETCH
    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

    function updateCartCount() {
        const desk = document.getElementById("cart-count");
        const mob = document.getElementById("cart-count-mobile");
        const mobMenu = document.getElementById("cart-count-mobile-menu");

        fetch("/cart/count")
            .then(res => res.json())
            .then(data => {
                if (desk) desk.innerText = data.count;
                if (mob) mob.innerText = data.count;
                if (mobMenu) mobMenu.innerText = data.count;
            });
    }

    function updateBackend(productId, qty, totalElem) {
        fetch(`/cart/update/${productId}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                [csrfHeader]: csrfToken
            },
            body: `qty=${qty}`
        })
        .then(res => res.json())
        .then(data => {
            if (data.itemTotal !== undefined) {
                totalElem.textContent = data.itemTotal;
            }
            if (data.grandTotal !== undefined) {
                document.getElementById("grandTotal").textContent = data.grandTotal;
            }
            if (data.count !== undefined) {
                updateCartCount();
            }
        })
        .catch(err => console.error("Cart update failed", err));
    }

    function removeFromCart(id, row) {
        fetch(`/cart/remove/${id}`, {
            method: "POST",
            headers: {
                [csrfHeader]: csrfToken
            }
        })
        .then(res => res.json())
        .then(data => {
            row.remove();
            if (data.grandTotal !== undefined) {
                document.getElementById("grandTotal").textContent = data.grandTotal;
            }
            updateCartCount();
        });
    }

    document.querySelectorAll(".cart-table tbody tr").forEach(row => {
        const id = row.getAttribute("data-row-id");
        const qtyElem = row.querySelector(".qty-value");
        const totalElem = row.querySelector("[data-total]");

        row.querySelector(".minus").addEventListener("click", () => {
            let qty = parseInt(qtyElem.textContent);
            if (qty > 1) {
                qty--;
                qtyElem.textContent = qty;
                updateBackend(id, qty, totalElem);
            }
        });

        row.querySelector(".plus").addEventListener("click", () => {
            let qty = parseInt(qtyElem.textContent);
            qty++;
            qtyElem.textContent = qty;
            updateBackend(id, qty, totalElem);
        });

        row.querySelector(".remove-btn").addEventListener("click", () => {
            removeFromCart(id, row);
        });
    });

</script>

<script>
    document.querySelector(".enquiry-form")?.addEventListener("submit", function () {
        const btn = document.getElementById("sendEnquiryBtn");
        btn.disabled = true;
        btn.innerText = "Sending...";
    });
</script>

<script src="/js/script.js"></script>
<!-- Before </body> -->
<script src="/js/animations.js"></script>

</body>
</html>
