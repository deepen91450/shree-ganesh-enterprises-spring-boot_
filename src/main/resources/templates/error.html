<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .error-container {
            text-align: center;
            background: #ffffff;
            padding: 36px;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            max-width: 420px;
            width: calc(100% - 32px);
        }

        h1 {
            font-size: 42px;
            color: #dc2626;
            margin: 0 0 8px;
        }

        h2 {
            margin: 0 0 10px;
            color: #111827;
            font-size: 22px;
        }

        p {
            color: #4b5563;
            margin: 0 0 22px;
        }

        a {
            display: inline-block;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<div class="error-container">
    <h1 th:text="${statusCode != null ? statusCode : 'Error'}">Error</h1>
    <h2 th:text="${errorTitle != null ? errorTitle : 'Something went wrong'}">Something went wrong</h2>
    <p th:text="${errorMessage != null ? errorMessage : 'Please try again later.'}">
        Please try again later.
    </p>
    <a th:href="@{/}">Back to Home</a>
</div>
</body>
</html>
