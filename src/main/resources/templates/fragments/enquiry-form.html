<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="enquiry-form" class="enquiry-wrapper">

    <!-- Success Message -->
    <div th:if="${successMsg}" class="success-msg">
        <p th:text="${successMsg}"></p>
    </div>

    <form action="/submit-enquiry" method="post" class="enquiry-form">

        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="text" name="phone" placeholder="Phone Number"  pattern="[6-9][0-9]{9}"
               title="Enter a valid 10-digit Indian mobile number" required>
        <input type="text" name="company" placeholder="Company Name" required>

        <textarea name="message" rows="4" placeholder="Your Message" required></textarea>

        <button type="submit">Send Enquiry</button>
    </form>

</div>

</body>
</html>
