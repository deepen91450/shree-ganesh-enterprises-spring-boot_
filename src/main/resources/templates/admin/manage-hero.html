<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manage Hero Banners</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin-manage-hero.css}">
</head>

<body>

<main class="main-content">
    <div class="hero-banner-container">

        <h2 class="hero-banner-title">Manage Hero Banners</h2>

        <form th:action="@{/admin/hero/add}" method="post" enctype="multipart/form-data" class="hero-banner-form">
            <div class="field">
                <label>Banner Image</label>
                <input type="file" name="file" required>
            </div>

            <div class="field">
                <label>Title</label>
                <input type="text" name="title" placeholder="Title">
            </div>

            <div class="field">
                <label>Subtitle</label>
                <input type="text" name="subtitle" placeholder="Subtitle">
            </div>

            <button type="submit">Add Banner</button>
        </form>

        <div class="table-shell">
            <table class="hero-banner-table">
                <thead>
                <tr>
                    <th>Image</th>
                    <th>Title</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${banners}">
                    <td>
                        <img th:src="${b.imageUrl}" alt="Banner image">
                    </td>
                    <td th:text="${b.title}"></td>
                    <td>
                        <a class="btn-danger"
                           th:href="@{'/admin/hero/delete/' + ${b.id}}"
                           onclick="return confirm('Delete this banner?')">
                            Delete
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>

</body>
</html>
