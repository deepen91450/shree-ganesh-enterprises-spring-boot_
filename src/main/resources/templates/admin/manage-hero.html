<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manage Hero Banners</title>

    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/admin-manage-hero.css}">

</head>

<body>

<div class="admin-container">

    <h2 class="admin-title">Admin Dashboard</h2>

    <!-- Admin Action Buttons -->
    <div class="admin-actions">

        <a href="/admin/add" class="action-btn add">+ Add New Product</a>
        <a href="/admin/categories" class="action-btn category">+ Add Category</a>

        <a href="/admin/customer-enquiries" class="action-btn enquiry">Customer Enquiries</a>
        <a href="/admin/product-enquiries" class="action-btn enquiry">Product Enquiries</a>

        <!-- ⭐ New Section Added -->
        <a href="/admin/hero" class="action-btn banner">🎨 Manage Hero Banners</a>

    </div>

</div>

<h2>Manage Hero Banners</h2>

<form th:action="@{/admin/hero/add}" method="post" enctype="multipart/form-data">
    <input type="file" name="file" required>
    <input type="text" name="title" placeholder="Title">
    <input type="text" name="subtitle" placeholder="Subtitle">
    <button type="submit">Add Banner</button>
</form>

<br>

<table border="1" cellpadding="8">
    <tr>
        <th>Image</th>
        <th>Title</th>
        <th>Action</th>
    </tr>

    <tr th:each="b : ${banners}">
        <td>
            <img th:src="${b.imageUrl}" width="150" style="border-radius:5px;">
        </td>
        <td th:text="${b.title}"></td>
        <td>
            <a th:href="@{'/admin/hero/delete/' + ${b.id}}" onclick="return confirm('Delete this banner?')">
                Delete
            </a>
        </td>
    </tr>
</table>

</body>
</html>
