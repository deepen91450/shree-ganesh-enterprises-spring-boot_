<div th:fragment="content" xmlns:th="http://www.thymeleaf.org">

    <!-- SUCCESS TOAST -->
    <div th:if="${param.success != null and param.success[0] == 'customerReply'}"
         class="toast success">
        Customer enquiry replied successfully
    </div>

    <h1 class="page-title">Customer Enquiries</h1>

    <!-- TABLE -->
    <div class="table-shell">
        <table class="customer-enquiry-table">

            <thead>
            <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Company</th>
                <th>Message</th>
                <th>Date</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="e : ${enquiries}">
                <td th:text="${e.id}"></td>
                <td th:text="${e.name}"></td>
                <td th:text="${e.email}"></td>
                <td th:text="${e.phone}"></td>
                <td th:text="${e.company}"></td>
                <td th:text="${e.message}"></td>
                <td th:text="${#temporals.format(e.createdAt,'dd-MM-yyyy HH:mm')}"></td>

                <td>
                    <span th:if="${e.adminReply == null}" class="badge pending">Pending</span>
                    <span th:if="${e.adminReply != null}" class="badge replied">Replied</span>
                </td>

                <td>
                    <a th:href="@{'/admin/enquiries/customers/reply/' + ${e.id}}"
                       class="btn small"><span data-lucide="reply"></span>Reply</a>
                </td>
            </tr>

            <!-- NO DATA CASE -->
            <tr th:if="${#lists.isEmpty(enquiries)}">
                <td colspan="9" class="empty-state">
                    No enquiries found
                </td>
            </tr>

            </tbody>
        </table>
    </div>

    <!-- PAGINATION -->
    <div class="pagination">

        <!-- Previous -->
        <a th:if="${currentPage > 0}"
           th:href="@{/admin/enquiries/customers(page=${currentPage - 1})}">
            Prev
        </a>

        <!-- Page Numbers -->
        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
            <a th:href="@{/admin/enquiries/customers(page=${i})}"
               th:text="${i + 1}"
               th:classappend="${i == currentPage} ? 'active' : ''">
            </a>
        </span>

        <!-- Next -->
        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/admin/enquiries/customers(page=${currentPage + 1})}">
            Next
        </a>

    </div>

</div>
