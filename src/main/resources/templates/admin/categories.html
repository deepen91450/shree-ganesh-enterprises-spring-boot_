<div th:fragment="content" xmlns:th="http://www.w3.org/1999/xhtml">

    <h1 class="page-title">Categories</h1>

    <!-- ADD CATEGORY BUTTON -->
    <div class="category-actions">
        <a href="/admin/categories/add" class="btn">+ Add Category</a>
    </div>

    <!-- CATEGORY TABLE -->
    <table class="cat-table">
        <thead>
        <tr>
            <th>Name</th>
            <th>Parent</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="c : ${categories}">
            <td th:text="${c.name}"></td>
            <td th:text="${c.parent != null ? c.parent.name : 'ROOT'}"></td>
            <td class="actions">
                <a class="edit-btn"
                   th:href="@{'/admin/categories/edit/' + ${c.id}}">
                    Edit
                </a>

                <a class="delete-btn"
                   th:href="@{'/admin/categories/delete/' + ${c.id}}"
                   onclick="return confirm('Delete this category?')">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
