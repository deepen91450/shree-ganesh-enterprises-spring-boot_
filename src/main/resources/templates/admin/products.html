<div th:fragment="content" xmlns:th="http://www.thymeleaf.org">

    <h1 class="page-title">Products</h1>

    <!-- SEARCH BAR -->
    <form method="get" action="/admin/products" class="search-bar">
        <input type="text"
               name="keyword"
               placeholder="Search product..."
               th:value="${keyword}">
        <button type="submit"><span data-lucide="search"></span>Search</button>

        <a href="/admin/add" class="btn"><span data-lucide="plus"></span>Add Product</a>
    </form>

    <!-- TABLE -->
    <div class="table-shell">
        <table class="admin-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Status</th>
                <th>Image</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="p : ${products}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.name}"></td>

                <td>&#8377; <span th:text="${p.price}"></span></td>

                <!-- STOCK -->
                <td th:text="${p.stockQuantity}"></td>

                <!-- STOCK STATUS -->
                <td>
                    <span th:if="${p.stockQuantity == 0}" class="stock-badge out">Out of Stock</span>
                    <span th:if="${p.stockQuantity > 0 and p.stockQuantity <= 5}" class="stock-badge low">Low Stock</span>
                    <span th:if="${p.stockQuantity > 5}" class="stock-badge in">In Stock</span>
                </td>

                <td>
                    <img th:src="${p.imagePath}" class="product-thumb" alt="Product image">
                </td>

                <td>
                    <div class="product-actions">
                        <!-- EXISTING -->
                        <a class="action-btn" th:href="@{/admin/products/{id}(id=${p.id})}">
                            <span data-lucide="eye"></span>View
                        </a>
                        <a class="action-btn" th:href="@{/admin/edit/{id}(id=${p.id})}">
                            <span data-lucide="pencil"></span>Edit
                        </a>
                        <form th:action="@{/admin/delete/{id}(id=${p.id})}"
                              method="post"
                              onsubmit="return confirm('Delete product?')">
                            <button class="action-btn danger" type="submit">
                                <span data-lucide="trash-2"></span>Delete
                            </button>
                        </form>

                        <!-- STOCK BUTTONS -->
                        <a class="action-btn success" th:href="@{/admin/add-stock/{id}(id=${p.id})}">
                            <span data-lucide="plus"></span>Stock
                        </a>

                        <a class="action-btn danger" th:href="@{/admin/reduce-stock/{id}(id=${p.id})}">
                            <span data-lucide="minus"></span>Stock
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- PAGINATION -->
    <div class="pagination">
        <a th:if="${currentPage > 0}"
           th:href="@{/admin/products(page=${currentPage - 1}, keyword=${keyword})}">
            Prev
        </a>

        <span>
            Page <b th:text="${currentPage + 1}"></b>
            of <b th:text="${totalPages}"></b>
        </span>

        <a th:if="${currentPage + 1 < totalPages}"
           th:href="@{/admin/products(page=${currentPage + 1}, keyword=${keyword})}">
            Next
        </a>
    </div>

</div>
