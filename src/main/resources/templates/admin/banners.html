<link rel="stylesheet" href="/css/admin-manage-hero.css">

<div class="hero-banner-container" xmlns:th="http://www.thymeleaf.org">

    <h2 class="hero-banner-title">Manage Hero Banners</h2>

    <!-- ADD BANNER FORM -->
    <form th:action="@{/admin/banners/add}"
          method="post"
          enctype="multipart/form-data"
          class="hero-banner-form">

        <div class="field">
            <label>Banner Image</label>
            <input type="file" name="file" required>
        </div>

        <div class="field">
            <label>Title</label>
            <input type="text" name="title">
        </div>

        <div class="field">
            <label>Subtitle</label>
            <input type="text" name="subtitle">
        </div>

        <button type="submit"><span data-lucide="plus"></span>Add Banner</button>
    </form>

    <hr>

    <!-- BANNERS LIST -->
    <div class="table-shell">
        <table class="hero-banner-table">
            <thead>
            <tr>
                <th>Image</th>
                <th>Title</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="b : ${banners}">
                <td>
                    <img th:src="${b.imageUrl}"
                         alt="Banner Image">
                </td>
                <td th:text="${b.title}"></td>
                <td>
                    <form th:action="@{/admin/banners/delete/{id}(id=${b.id})}"
                          method="post"
                          onsubmit="return confirm('Delete this banner?')">
                        <button class="btn-danger" type="submit">
                            <span data-lucide="trash-2"></span>Delete
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
