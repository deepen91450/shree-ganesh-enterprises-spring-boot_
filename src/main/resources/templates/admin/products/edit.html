<link rel="stylesheet" href="/css/admin/admin-edit-product.css">

<div class="edit-product-container" xmlns:th="http://www.thymeleaf.org">

    <h2 class="edit-product-title">Edit Product</h2>

    <form th:action="@{/admin/edit/{id}(id=${product.id})}"
          method="post"
          enctype="multipart/form-data"
          class="edit-form">

        <!-- CATEGORY -->
        <div class="field">
            <label class="edit-label">Select Category</label>
            <select name="category.id" class="edit-input dropdown">
                <th:block th:each="cat : ${categories}">
                    <option th:value="${cat.id}"
                            th:selected="${cat.id == product.category.id}"
                            th:text="${cat.name}">
                    </option>
                </th:block>
            </select>
        </div>

        <!-- NAME -->
        <div class="field">
            <label class="edit-label">Product Name</label>
            <input type="text"
                   name="name"
                   class="edit-input"
                   th:value="${product.name}"
                   required>
        </div>

        <!-- SHORT DESCRIPTION -->
        <div class="field">
            <label class="edit-label">Short Description</label>
            <textarea name="description"
                      class="edit-input edit-textarea"
                      required
                      th:text="${product.description}"></textarea>
        </div>

        <!-- PRICE -->
        <div class="field">
            <label class="edit-label">Price</label>
            <input type="number"
                   step="0.01"
                   name="price"
                   class="edit-input"
                   th:value="${product.price}">
        </div>

        <div class="field">
            <label class="edit-label">Max Order Quantity</label>
            <input type="number"
                   name="maxOrderQty"
                   class="edit-input"
                   min="1"
                   th:value="${product.maxOrderQty}"
                   placeholder="Default 200 if not set">
        </div>

        <!-- PRICE VISIBILITY -->
        <div class="edit-checkbox">
            <label>
                <input type="checkbox"
                       name="priceVisible"
                       value="true"
                       th:checked="${product.priceVisible}">
                Show Price (Enable Add to Cart)
            </label>
        </div>

        <!-- CURRENT IMAGE -->
        <div class="field">
            <label class="edit-label">Current Image</label>
            <img th:src="${product.imagePath}"
                 alt="Product Image"
                 class="current-image">
        </div>

        <!-- NEW IMAGE -->
        <div class="field">
            <label class="edit-label">Change Image</label>
            <input type="file"
                   name="image"
                   class="edit-input file">
        </div>

        <!-- LONG DESCRIPTION -->
        <div class="field">
            <label class="edit-label">Product Full Details</label>
            <textarea id="longDescription"
                      name="longDescription"
                      th:text="${product.longDescription}"></textarea>
        </div>

        <button type="submit" class="update-btn">
            <span data-lucide="save"></span>Update Product
        </button>
    </form>

    <div class="edit-back">
        <a href="/admin/products" class="back-btn"><span data-lucide="arrow-left"></span>Back to Products</a>
    </div>

</div>

<!-- CKEDITOR -->
<script src="https://cdn.ckeditor.com/ckeditor5/41.0.0/classic/ckeditor.js"></script>
<script>
    ClassicEditor.create(document.querySelector('#longDescription'));
</script>
