<div class="add-product-container" xmlns:th="http://www.thymeleaf.org">

    <h2 class="add-product-title">Add New Product</h2>

    <form th:action="@{/admin/add}" method="post"
          enctype="multipart/form-data"
          class="product-form">

        <!-- CATEGORY -->
        <div class="field">
            <label class="label">Select Category</label>
            <select name="categoryId" required class="form-input dropdown">
                <option value="">-- Select Category --</option>

                <th:block th:each="cat : ${categories}">
                    <option th:if="${cat.parent == null}"
                            th:value="${cat.id}"
                            th:text="${cat.name}">
                    </option>

                    <option th:each="sub : ${cat.children}"
                            th:value="${sub.id}"
                            th:text="'- ' + ${sub.name}">
                    </option>
                </th:block>
            </select>
        </div>

        <!-- NAME -->
        <div class="field">
            <label class="label">Product Name</label>
            <input type="text" name="name" required class="form-input">
        </div>

        <!-- SHORT DESCRIPTION -->
        <div class="field">
            <label class="label">Short Description</label>
            <textarea name="description" required class="form-input textarea"></textarea>
        </div>

        <!-- PRICE -->
        <div class="field">
            <label class="label">Price</label>
            <input type="number" step="0.01" name="price" class="form-input">
        </div>

        <!-- STOCK -->
        <div class="field">
            <label class="label">Stock Quantity</label>
            <input type="number"
                   name="stockQuantity"
                   class="form-input"
                   min="0"
                   value="0"
                   required>
        </div>

        <div class="field">
            <label class="label">Max Order Quantity</label>
            <input type="number"
                   name="maxOrderQty"
                   class="form-input"
                   min="1"
                   placeholder="Default 200 if not set">
        </div>

        <!-- PRICE VISIBILITY -->
        <div class="form-checkbox">
            <label>
                <input type="checkbox"
                       name="priceVisible"
                       value="true"
                       checked>
                Show Price (Enable Add to Cart)
            </label>
        </div>

        <!-- IMAGE -->
        <div class="field">
            <label class="label">Upload Product Image</label>
            <input type="file" name="image" required class="form-input file">
        </div>

        <!-- LONG DESCRIPTION -->
        <div class="field">
            <label class="label">Product Full Details</label>
            <textarea id="longDescription" name="longDescription"></textarea>
        </div>

        <button type="submit" class="save-btn">
            <span data-lucide="save"></span>Save Product
        </button>
    </form>

</div>

<!-- CKEDITOR -->
<script src="https://cdn.ckeditor.com/ckeditor5/41.0.0/classic/ckeditor.js"></script>
<script>
    ClassicEditor.create(document.querySelector('#longDescription'));
</script>
