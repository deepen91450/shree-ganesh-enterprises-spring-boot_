<div class="form-container" xmlns:th="http://www.thymeleaf.org">

    <h2>Reduce Stock</h2>

    <form th:action="@{/admin/reduce-stock}" method="post">

        <input type="hidden" name="productId" th:value="${product.id}">

        <p><b th:text="${product.name}"></b></p>

        <p>Current Stock: <b th:text="${product.stockQuantity}"></b></p>

        <div class="field">
            <label>Quantity to Reduce</label>
            <input type="number" name="quantity" required min="1">
        </div>

        <div class="quick-actions">
            <button type="submit"><span data-lucide="minus"></span>Reduce Stock</button>
            <a href="/admin/products" class="btn secondary">Cancel</a>
        </div>

    </form>

</div>
