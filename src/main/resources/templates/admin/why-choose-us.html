<div th:fragment="content"
     xmlns:th="http://www.thymeleaf.org">

    <h2 class="admin-page-title">Why Choose Us</h2>

    <!-- ================= ADD FORM ================= -->
    <div class="admin-card">
        <form th:action="@{/admin/why-choose-us/save}"
              method="post"
              enctype="multipart/form-data">

            <div class="form-group">
                <label>Title</label>
                <input type="text"
                       name="title"
                       placeholder="Eg: Premium Quality"
                       required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description"
                          rows="3"
                          placeholder="Short description shown on home page"
                          required></textarea>
            </div>

            <div class="form-group">
                <label>Icon (PNG / JPG / SVG)</label>
                <input type="file"
                       name="iconFile"
                       accept="image/*"
                       required>
            </div>

            <button class="btn-primary" type="submit">
                <span data-lucide="plus"></span>Add Item
            </button>
        </form>
    </div>

    <!-- ================= LIST ================= -->
    <div class="admin-card why-items-card">
        <h3>Existing Items</h3>

        <div class="table-shell">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>Icon</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="item : ${items}">
                    <td>
                        <img th:src="${item.iconPath}"
                             alt="icon"
                             class="why-icon">
                    </td>

                    <td th:text="${item.title}"></td>

                    <td th:text="${item.description}"></td>

                    <td>
                        <form th:action="@{/admin/why-choose-us/delete/{id}(id=${item.id})}"
                              method="post"
                              onsubmit="return confirm('Delete this item?')">
                            <button class="btn-danger" type="submit">
                                <span data-lucide="trash-2"></span>Delete
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
