<div class="category-container" xmlns:th="http://www.thymeleaf.org">

    <h2 class="category-title">Add Category</h2>

    <form th:action="@{/admin/categories/add}"
          method="post"
          enctype="multipart/form-data"
          class="category-form">

        <div class="field">
            <label>Category Name</label>
            <input type="text" name="name" required>
        </div>

        <div class="field">
            <label>Parent Category</label>
            <select name="parentId">
                <option value="">None (Root Category)</option>
                <option th:each="c : ${categories}"
                        th:value="${c.id}"
                        th:text="${c.name}">
                </option>
            </select>
        </div>

        <div class="field">
            <label>Category Image</label>
            <input type="file" name="image" required>
        </div>

        <button type="submit"><span data-lucide="save"></span>Save Category</button>
    </form>

</div>
