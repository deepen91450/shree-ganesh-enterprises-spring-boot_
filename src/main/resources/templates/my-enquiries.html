<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Enquiries</title>

    <!-- GLOBAL DESIGN SYSTEM -->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <!-- In <head>, last CSS -->
    <link rel="stylesheet" href="/css/animations.css">
    <!-- HEADER / NAV -->
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/footer.css">

    <!-- PAGE CSS -->
    <link rel="stylesheet" href="/css/my-enquiries.css">

</head>
<body>

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container">

    <h2 class="page-title">My Enquiries</h2>

    <!-- No enquiries -->
    <p th:if="${#lists.isEmpty(productEnquiries)}" class="no-enquiry">
        🚫 You have not made any enquiries yet.
    </p>

    <!-- PRODUCT ENQUIRIES -->
    <div th:if="${!#lists.isEmpty(productEnquiries)}">

        <div th:each="e : ${productEnquiries}" class="enquiry-card">

            <!-- Header -->
            <div class="enquiry-header">
                <h3>Enquiry #<span th:text="${e.id}"></span></h3>

                <span class="status"
                      th:classappend="${e.adminReply != null} ? 'replied' : 'pending'">
                    <span th:text="${e.adminReply != null ? 'Replied' : 'Pending'}"></span>
                </span>
            </div>

            <!-- Date -->
            <div class="enquiry-date">
                <span th:text="${#temporals.format(e.createdAt, 'dd MMM yyyy, HH:mm')}"></span>
            </div>

            <!-- Message -->
            <div class="enquiry-box">
                <strong>Your Message</strong>
                <p th:text="${e.message}"></p>
            </div>

            <!-- Admin Reply -->
            <div class="enquiry-reply" th:if="${e.adminReply != null}">
                <strong>Admin Reply</strong>
                <p th:text="${e.adminReply}"></p>
            </div>

            <!-- Products -->
            <div class="product-list">
                <div class="product-item" th:each="item : ${e.items}">

                    <img th:src="${item.productImage != null} ? @{${item.productImage}} : @{/images/no-product.png}"
                         onerror="this.onerror=null;this.src='/images/no-product.png';"
                         alt="Product">

                    <div class="product-info">
                        <h4 th:text="${item.productName}"></h4>
                        <p>Qty: <span th:text="${item.quantity}"></span></p>
                        <p class="price">₹ <span th:text="${item.productPrice}"></span></p>
                    </div>

                </div>
            </div>

        </div>

        <!-- ================= PAGINATION ================= -->
        <div class="pagination" th:if="${totalPages > 1}">

            <!-- Prev -->
            <a th:if="${currentPage > 0}"
               th:href="@{/my-enquiries(page=${currentPage - 1})}">
                ⬅ Prev
            </a>

            <!-- Page Numbers -->
            <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                <a th:href="@{/my-enquiries(page=${i})}"
                   th:classappend="${i == currentPage} ? 'active'">
                    <span th:text="${i + 1}"></span>
                </a>
            </span>

            <!-- Next -->
            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/my-enquiries(page=${currentPage + 1})}">
                Next ➡
            </a>

        </div>

    </div>

</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="/js/script.js"></script>
<!-- Before </body> -->
<script src="/js/animations.js"></script>

</body>
</html>
