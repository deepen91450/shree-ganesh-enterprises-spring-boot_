<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Product</title>
    <link rel="stylesheet" href="/css/add-product.css"> <!-- Same styling as Add Product -->
</head>

<body>

<div class="add-product-container">

    <h2 class="add-product-title">Edit Product</h2>

    <form th:action="@{'/admin/edit/' + ${product.id}}"
          th:object="${product}"
          method="post"
          enctype="multipart/form-data"
          class="product-form">

        <!-- CATEGORY DROPDOWN -->
        <label class="label">Select Category</label>

        <select name="category.id" required class="form-input dropdown">

            <option value="">-- Select Category --</option>

            <th:block th:each="cat : ${categories}">

                <!-- Parent Category -->
                <option th:if="${cat.parent == null}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"
                        th:selected="${product.category != null && product.category.id == cat.id}">
                </option>

                <!-- Subcategories -->
                <option th:each="sub : ${cat.children}"
                        th:value="${sub.id}"
                        th:text="'— ' + ${sub.name}"
                        th:selected="${product.category != null && product.category.id == sub.id}">
                </option>

            </th:block>
        </select>


        <!-- PRODUCT NAME -->
        <label class="label">Product Name</label>
        <input type="text" th:field="*{name}" required class="form-input">


        <!-- SHORT DESCRIPTION -->
        <label class="label">Short Description</label>
        <textarea th:field="*{description}" required class="form-input textarea"></textarea>


        <!-- FULL DETAILS (CKEditor) -->
        <label class="label">Product Full Details</label>
        <textarea id="longDescription"
                  name="longDescription"
                  th:utext="${product.longDescription}">
        </textarea>


        <!-- PRICE -->
        <label class="label">Price</label>
        <input type="number" step="0.01" th:field="*{price}" required class="form-input">


        <!-- CURRENT IMAGE -->
        <label class="label">Current Image</label>
        <img th:src="@{${product.imagePath}}"
             width="120"
             alt="Current Image"
             style="border-radius:8px; margin-bottom:10px;">


        <!-- UPLOAD NEW IMAGE -->
        <label class="label">Upload New Image (optional)</label>
        <input type="file" name="image" accept="image/*" class="form-input file">


        <!-- UPDATE BUTTON -->
        <button type="submit" class="save-btn">Update Product</button>

    </form>

    <!-- BACK BUTTON -->
    <div class="back-btn-box">
        <a href="/admin/dashboard" class="back-btn">← Back to Dashboard</a>
    </div>

</div>


<!-- CKEDITOR SCRIPT -->
<script src="https://cdn.ckeditor.com/ckeditor5/41.0.0/classic/ckeditor.js"></script>

<script>
    ClassicEditor
        .create(document.querySelector('#longDescription'), {
            ckfinder: {
                uploadUrl: '/admin/upload-image' // OPTIONAL – Image upload endpoint
            },
            toolbar: [
                'heading', '|',
                'bold', 'italic', 'underline', '|',
                'bulletedList', 'numberedList', '|',
                'insertTable', '|',
                'alignment', '|',
                'imageUpload', 'link', '|',
                'undo', 'redo'
            ],
            table: {
                contentToolbar: ['tableColumn', 'tableRow', 'mergeTableCells']
            }
        })
        .catch(error => console.error(error));
</script>

</body>
</html>
