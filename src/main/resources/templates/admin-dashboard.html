<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/css/admin-dashboard.css">

    <style>
        /* Small enhancements for buttons */
        .btn-view {
            background: #17a2b8;
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 4px;
        }
        .btn-view:hover { background: #117684; }

        .btn-warning {
            background: #ffc107;
            padding: 6px 14px;
            border-radius: 6px;
            color: black;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 4px;
        }
        .btn-warning:hover { background: #e0a800; }

        .btn-danger {
            background: #dc3545;
            padding: 6px 14px;
            border-radius: 6px;
            color: white;
            text-decoration: none;
            display: inline-block;
        }
        .btn-danger:hover { background: #c82333; }

        .action-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
    </style>
</head>

<body>

<div class="admin-container">

    <h2 class="admin-title">Admin Dashboard</h2>

    <!-- Admin Action Buttons -->
    <div class="admin-actions">

        <a href="/admin/add" class="action-btn add">+ Add New Product</a>
        <a href="/admin/categories" class="action-btn category">+ Add Category</a>

        <a href="/admin/customer-enquiries" class="action-btn enquiry">Customer Enquiries</a>
        <a href="/admin/product-enquiries" class="action-btn enquiry">Product Enquiries</a>

        <!-- ⭐ New Section Added -->
        <a href="/admin/hero" class="action-btn banner">🎨 Manage Hero Banners</a>

    </div>

    <div class="logout-box">
        <form th:action="@{/admin/logout}" method="post">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>

    <!-- Product Table -->
    <table class="admin-table">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Image</th>
            <th>Actions</th>
        </tr>

        <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.description}"></td>
            <td>₹ <span th:text="${product.price}"></span></td>
            <td>
                <img th:src="@{${product.imagePath}}" width="80" style="border-radius:6px;"/>
            </td>

            <!-- ⭐ View / Edit / Delete Buttons -->
            <td class="action-container">

                <!-- VIEW BUTTON -->
                <a th:href="@{'/admin/products/' + ${product.id}}"
                   class="btn-view">
                    View
                </a>

                <!-- EDIT BUTTON -->
                <a th:href="@{'/admin/edit/' + ${product.id}}"
                   class="btn-warning">
                    Edit
                </a>

                <!-- DELETE BUTTON -->
                <a th:href="@{'/admin/delete/' + ${product.id}}"
                   onclick="return confirm('Are you sure you want to delete this product?');"
                   class="btn-danger">
                    Delete
                </a>
            </td>
        </tr>
    </table>

</div>

</body>
</html>
