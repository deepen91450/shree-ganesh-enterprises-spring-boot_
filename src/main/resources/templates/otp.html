<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin 2FA Verification</title>
    <link rel="stylesheet" th:href="@{/css/admin-otp.css}">
</head>

<body>

<div class="box">
    <h2>Admin 2FA</h2>

    <p class="subtitle">Scan this QR using Google Authenticator</p>

    <img th:src="'data:image/png;base64,' + ${qr}" alt="QR Code"/>

    <form th:action="@{/admin/2fa/verify}" method="post">
        <input type="text" name="otp" placeholder="Enter 6-digit OTP" required />
        <small style="color:#6b7280;">
            Code refreshes every 30 seconds
        </small>
        <button type="submit">Verify</button>
    </form>

    <div class="error" th:if="${error}" th:text="${error}"></div>
    <div class="error" th:if="${param.rateLimited}">
        Too many OTP attempts. Please wait a few minutes and try again.
    </div>
</div>

</body>
</html>
