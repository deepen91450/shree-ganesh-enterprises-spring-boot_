<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Products</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSRF -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">

    <!-- In <head>, last CSS -->
    <link rel="stylesheet" href="/css/animations.css">

    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/products.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/categories-list.css">
</head>

<body>

<!-- HEADER -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- TOAST -->
<div id="toast">Added to Cart!</div>

<main class="product-page">

    <!-- CATEGORY GRID -->
    <section class="category-section">

        <h2 class="category-title">Product Categories</h2>

        <div class="category-grid">
            <div class="category-card" th:each="c : ${categories}">
                <div class="cat-img-box">
                    <img th:src="${c.imagePath}" alt="Category Image">
                </div>
                <h3 th:text="${c.name}"></h3>
                <a class="btn btn-primary" th:href="@{'/categories/' + ${c.id}}">
                    View Products →
                </a>
            </div>
        </div>

    </section>

    <!-- PRODUCT GRID -->
    <section class="product-section">

        <h2>Our Products</h2>

        <div class="product-grid">

            <div class="product-card"
                 th:each="p : ${products}"
                 th:attr="data-url=@{'/product/' + ${p.id}}">

                <img th:src="${p.imagePath}" alt="Product">

                <h3 th:text="${p.name}"></h3>

                <p th:text="${#strings.abbreviate(p.description, 80)}"></p>

                <div th:if="${p.priceVisible}">

                    <p class="price">
                        ₹ <span th:text="${p.price}"></span>
                    </p>

                    <div class="qty-box">
                        <button type="button" class="qty-btn minus">-</button>
                        <input type="number"
                               class="qty-input"
                               value="1"
                               min="1"
                               th:attr="max=${p.maxOrderQty != null ? p.maxOrderQty : 200}">
                        <button type="button" class="qty-btn plus">+</button>
                    </div>

                    <button type="button"
                            class="add-to-cart-btn"
                            th:attr="data-product-id=${p.id}">
                        Add to Cart
                    </button>

                </div>

                <div th:if="${!p.priceVisible}" class="enquiry-only">
                    <a class="enquire-btn"
                       th:href="@{/contact(productId=${p.id}, productName=${p.name})}">
                        Enquire Now
                    </a>
                </div>

                <a class="view-details-btn"
                   th:href="@{'/product/' + ${p.id}}">
                    View Details →
                </a>

            </div>

        </div>

        <!-- PAGINATION -->
        <div class="pagination" th:if="${totalPages > 1}">

            <a th:if="${currentPage > 0}"
               th:href="@{/products(page=${currentPage - 1}, size=20)}">
                ← Prev
            </a>

            <span>
                Page <span th:text="${currentPage + 1}"></span>
                of <span th:text="${totalPages}"></span>
            </span>

            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/products(page=${currentPage + 1}, size=20)}">
                Next →
            </a>

        </div>

    </section>

</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- ONLY GLOBAL SCRIPT -->
<script src="/js/script.js"></script>

<script>
    function openProductCard(event, card) {
        if (
            event.target.closest("button") ||
            event.target.closest("a") ||
            event.target.closest("input")
        ) return;

        window.location.href = card.dataset.url;
    }
</script>

<!-- Before </body> -->
<script src="/js/animations.js"></script>

</body>
</html>
