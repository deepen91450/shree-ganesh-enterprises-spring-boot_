<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Products</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">

    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/products.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/categories-list.css">
</head>

<body>

<!-- HEADER -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Toast -->
<div id="toast">Added to Cart!</div>

<main class="product-page">

    <!-- ⭐ CATEGORY GRID -->
    <section class="category-section">

        <h2 class="category-title">Product Categories</h2>

        <div class="category-grid">
            <div class="category-card" th:each="c : ${categories}">
                <div class="cat-img-box">
                    <img th:src="${c.imagePath}" alt="Category Image">
                </div>
                <h3 th:text="${c.name}"></h3>
                <a class="cat-btn" th:href="@{'/categories/' + ${c.id}}">
                    View Products →
                </a>
            </div>
        </div>

    </section>

    <!-- ⭐ PRODUCT GRID -->
    <section class="product-section">

        <h2>Our Products</h2>

        <div class="product-grid">

            <div class="product-card"
                 th:each="p : ${products}"
                 th:attr="data-url=@{'/product/' + ${p.id}}"
                 onclick="openProductCard(event, this)">

                <!-- IMAGE -->
                <img th:src="${p.imagePath}" alt="Product">

                <!-- NAME -->
                <h3 th:text="${p.name}"></h3>

                <!-- SHORT DESCRIPTION -->
                <p th:text="${#strings.abbreviate(p.description, 80)}"></p>

                <!-- ================= PRICED PRODUCT ================= -->
                <div th:if="${p.priceVisible}">

                    <p class="price">
                        ₹ <span th:text="${p.price}"></span>
                    </p>

                    <!-- QTY -->
                    <div class="qty-box">
                        <button type="button" class="qty-btn minus">-</button>
                        <input type="number" class="qty-input" value="1" min="1">
                        <button type="button" class="qty-btn plus">+</button>
                    </div>

                    <!-- ADD TO CART -->
                    <button type="button"
                            class="add-to-cart-btn"
                            th:attr="data-product-id=${p.id}">
                        Add to Cart
                    </button>

                </div>

                <!-- ================= ENQUIRY ONLY PRODUCT ================= -->
                <div th:if="${!p.priceVisible}" class="enquiry-only">

                    <a class="enquire-btn"
                       th:href="@{/contact(
                            productId=${p.id},
                            productName=${p.name}
                       )}">
                        Enquire Now
                    </a>

                </div>

                <!-- VIEW DETAILS -->
                <a class="view-details-btn"
                   th:href="@{'/product/' + ${p.id}}">
                    View Details →
                </a>

            </div>

        </div>

        <!-- PAGINATION -->
        <div class="pagination" th:if="${totalPages > 1}">

            <!-- Prev -->
            <a th:if="${currentPage > 0}"
               th:href="@{/products(page=${currentPage - 1}, size=20)}">
                ← Prev
            </a>

            <span>
        Page <span th:text="${currentPage + 1}"></span>
        of <span th:text="${totalPages}"></span>
    </span>

            <!-- Next -->
            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/products(page=${currentPage + 1}, size=20)}">
                Next →
            </a>

        </div>


    </section>

</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- GLOBAL JS -->
<script src="/js/script.js"></script>

<!-- CART + QTY JS (UNCHANGED & SAFE) -->
<script>
    function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2000);
    }

    function updateCartCount() {
        const desk = document.getElementById("cart-count");
        const mob = document.getElementById("cart-count-mobile");
        const mobMenu = document.getElementById("cart-count-mobile-menu");

        fetch("/cart/count")
            .then(res => res.json())
            .then(data => {
                if (desk) desk.innerText = data.count;
                if (mob) mob.innerText = data.count;
                if (mobMenu) mobMenu.innerText = data.count;
            });
    }

    document.querySelectorAll(".product-card").forEach(card => {
        const minus = card.querySelector(".minus");
        const plus = card.querySelector(".plus");
        const input = card.querySelector(".qty-input");

        if (minus && plus && input) {
            minus.onclick = () => input.value > 1 && input.value--;
            plus.onclick = () => input.value = Number(input.value) + 1;
        }
    });

    document.querySelectorAll(".add-to-cart-btn").forEach(btn => {
        btn.onclick = () => {
            const productId = btn.dataset.productId;
            const qty = btn.closest(".product-card").querySelector(".qty-input").value;

            fetch("/cart/ajax/add", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    "X-Requested-With": "XMLHttpRequest"
                },
                body: "id=" + productId + "&qty=" + qty
            })
            .then(res => res.json())
            .then(data => {
                if (data.error === "not_logged_in") {
                    window.location.href = data.redirect;
                    return;
                }
                showToast("Added to cart!");
                updateCartCount();
            });
        };
    });

    function openProductCard(event, card) {
        if (
            event.target.closest("button") ||
            event.target.closest("a") ||
            event.target.closest("input")
        ) return;

        window.location.href = card.dataset.url;
    }
</script>

</body>
</html>
