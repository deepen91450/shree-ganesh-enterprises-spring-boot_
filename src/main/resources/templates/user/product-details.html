<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${product.name}">Product Details</title>

    <!-- GLOBAL STYLES -->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">

    <!-- PAGE SPECIFIC -->
    <link rel="stylesheet" href="/css/product-details.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/footer.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<!-- HEADER -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="details-wrapper">

    <!-- TOP PRODUCT SECTION -->
    <div class="details-container">

        <!-- LEFT IMAGE -->
        <div class="left-box">
            <img th:src="${product.imagePath}" alt="Product Image">
        </div>

        <!-- RIGHT SIDE DETAILS -->
        <div class="right-box">

            <h1 th:text="${product.name}"></h1>

            <!-- PRICE -->
            <div th:if="${product.priceVisible}" class="price">
                ₹ <span th:text="${product.price}"></span>
            </div>

            <div th:if="${!product.priceVisible}" class="price enquiry-text">
                Price available on request
            </div>

            <p class="short-desc" th:text="${product.description}"></p>

            <!-- ACTION SECTION -->
            <div class="action-buttons">

                <!-- ===== PRICED PRODUCT ===== -->
                <div th:if="${product.priceVisible}" class="priced-actions">

                    <div class="qty-box">
                        <button class="minus">-</button>
                        <input type="number" id="qty" value="1" min="1">
                        <button class="plus">+</button>
                    </div>

                    <button class="add-cart" id="addToCartBtn">
                        Add to Cart
                    </button>

                    <a th:href="@{/contact(
                productId=${product.id},
                productName=${product.name}
            )}"
                       class="enquire-btn secondary">
                        Enquire Now
                    </a>

                </div>

                <!-- ===== ENQUIRY ONLY PRODUCT ===== -->
                <div th:if="${!product.priceVisible}" class="enquiry-only-actions">

                    <a th:href="@{/contact(
                productId=${product.id},
                productName=${product.name}
            )}"
                       class="enquire-btn primary">
                        Enquire Now
                    </a>

                </div>

            </div>


            <!-- HELP -->
            <div class="help-box">
                Need help choosing the right size?
                <a href="/contact">Talk to our expert</a>
            </div>

            <!-- TRUST -->
            <div class="trust-points">
                <span>✔ Quality Checked</span>
                <span>✔ Trusted by Industries</span>
                <span>✔ GST Invoice Available</span>
            </div>

            <div class="product-meta">
                <p>📍 PAN India delivery available</p>
                <p>📞 Bulk & custom orders accepted</p>
            </div>

        </div>

    </div>

    <!-- FULL DETAILS -->
    <div class="full-details">
        <h2>Product Details</h2>
        <div th:utext="${product.longDescription}"></div>
    </div>

</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- JS -->
<script>

    // QTY BUTTONS (only if present)
    const plusBtn = document.querySelector(".plus");
    const minusBtn = document.querySelector(".minus");
    const qtyInput = document.querySelector("#qty");

    if (plusBtn && minusBtn && qtyInput) {
        plusBtn.onclick = () => qtyInput.value++;
        minusBtn.onclick = () => {
            if (qtyInput.value > 1) qtyInput.value--;
        };
    }

    // ADD TO CART (only if button exists)
    const addBtn = document.querySelector("#addToCartBtn");

    if (addBtn) {
        addBtn.onclick = () => {
            let qty = document.querySelector("#qty").value;
            let productId = [[${product.id}]];
            window.location.href = "/cart/add/" + productId + "?qty=" + qty;
        };
    }

</script>

<script src="/js/script.js"></script>

</body>
</html>
