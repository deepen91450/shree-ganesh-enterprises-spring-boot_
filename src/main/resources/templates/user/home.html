<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Shree Ganesh Enterprises</title>

    <!-- Google Fonts (already using Poppins via global.css) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Core CSS -->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">

    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/navbar.css">

    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/enquiry.css">

    <!-- ✅ ANIMATION CSS — add LAST so it can override -->
    <link rel="stylesheet" href="/css/animations.css">
</head>

<body>

<!-- HEADER -->
<div th:replace="~{fragments/header :: header}"></div>

<main>

    <!-- ================= HERO SLIDER ================= -->
    <!-- animations.js will inject Gmail-colored particles inside this section -->
    <section class="hero-section">

        <div id="heroSlider" class="hero-slider">
            <div th:each="b : ${banners}" class="hero-slide">
                <img th:src="${b.imageUrl}" alt="Banner">
                <div class="hero-content">
                    <h1 th:text="${b.title}"></h1>
                    <p th:text="${b.subtitle}"></p>
                </div>
            </div>
        </div>

        <!-- Slider Dots (z-index: 4 via animations.css) -->
        <div id="sliderDots"></div>

    </section>

    <!-- ================= PRODUCT CATEGORIES ================= -->
    <!-- .category-card gets scroll-reveal automatically via animations.js -->
    <section class="category-section">
        <h2 class="section-title reveal">Product Categories</h2>

        <div class="category-grid">
            <div th:each="cat : ${categories}" class="category-card">
                <img th:src="${cat.imagePath}" alt="category-image">
                <h3 th:text="${cat.name}"></h3>
                <a th:href="@{'/categories/' + ${cat.id}}" class="btn btn-primary">
                    View Products →
                </a>
            </div>
        </div>
    </section>

    <!-- ================= WHY CHOOSE US ================= -->
    <!-- .why-card gets scroll-reveal automatically via animations.js -->
    <section class="why-section">
        <h2 class="section-title reveal">Why Choose Us</h2>

        <div class="why-grid">
            <div class="why-card" th:each="w : ${whyList}">
                <img th:src="${w.iconPath}" alt="icon">
                <h3 th:text="${w.title}"></h3>
                <p th:text="${w.description}"></p>
            </div>
        </div>
    </section>

</main>

<!-- FOOTER -->
<!-- animations.js will inject Gmail-colored particles inside footer.footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Scripts -->
<script src="/js/script.js"></script>

<!-- ✅ ANIMATION ENGINE — add before closing body -->
<script src="/js/animations.js"></script>

<script>
    /* ── Hero Slider ── */
    let index = 0;
    const slider     = document.getElementById("heroSlider");
    const slides     = document.querySelectorAll(".hero-slide");
    const dotsContainer = document.getElementById("sliderDots");

    slides.forEach((_, i) => {
        const dot = document.createElement("div");
        dot.addEventListener("click", () => goToSlide(i));
        dotsContainer.appendChild(dot);
    });

    const dots = document.querySelectorAll("#sliderDots div");
    updateDots();

    function updateDots() {
        dots.forEach(dot => dot.classList.remove("active"));
        if (dots[index]) dots[index].classList.add("active");
    }

    function goToSlide(i) {
        index = i;
        slider.style.transform = `translateX(-${index * 100}%)`;
        updateDots();
    }

    function autoSlide() {
        index = (index + 1) % slides.length;
        goToSlide(index);
    }

    setInterval(autoSlide, 4000);

</script>

</body>
</html>
