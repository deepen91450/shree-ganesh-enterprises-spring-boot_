<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Search Results</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ✅ CSRF META TAGS (IMPORTANT) -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- GLOBAL + COMPONENT CSS -->
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <!-- In <head>, last CSS -->
    <link rel="stylesheet" href="/css/animations.css">
    <!-- SEARCH RESULT PAGE CSS -->
    <link rel="stylesheet" href="/css/search-results.css">
</head>

<body>

<!-- HEADER -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Toast -->
<div id="toast">Added to Cart!</div>

<main class="search-page">

    <h2 class="search-title">
        Results for: "<span th:text="${keyword}"></span>"
    </h2>

    <!-- WHEN NO PRODUCT FOUND -->
    <div th:if="${products.size() == 0}">
        <p class="no-result-text">No products found.</p>
    </div>

    <!-- PRODUCT GRID -->
    <div class="product-grid">
        <div class="product-card" th:each="p : ${products}">

            <img th:src="${p.imagePath}" alt="Product">
            <h3 th:text="${p.name}"></h3>
            <p th:text="${#strings.abbreviate(p.description, 80)}"></p>

            <!-- PRICED PRODUCT -->
            <div th:if="${p.priceVisible}">
                <p class="price">
                    ₹ <span th:text="${p.price}"></span>
                </p>

                <div class="qty-box">
                    <button type="button" class="qty-btn minus">-</button>
                    <input type="number" class="qty-input" value="1" min="1">
                    <button type="button" class="qty-btn plus">+</button>
                </div>

                <button type="button"
                        class="add-to-cart-btn"
                        th:attr="data-product-id=${p.id}">
                    Add to Cart
                </button>
            </div>

            <!-- ENQUIRY PRODUCT -->
            <div th:if="${!p.priceVisible}" class="enquiry-only">
                <a class="enquire-btn"
                   th:href="@{/contact(productId=${p.id}, productName=${p.name})}">
                    Enquire Now
                </a>
            </div>

            <a class="view-details-btn"
               th:href="@{'/product/' + ${p.id}}">
                View Details →
            </a>

        </div>
    </div>

    <!-- PAGINATION -->
    <div class="pagination" th:if="${totalPages > 1}">
        <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
           th:href="@{/search(q=${keyword}, page=${i})}"
           th:text="${i + 1}"
           th:classappend="${i == currentPage} ? 'active'">
        </a>
    </div>

</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- All cart, qty, toast, and CSRF logic is handled by script.js -->
<script src="/js/script.js"></script>
<!-- Before </body> -->
<script src="/js/animations.js"></script>

</body>
</html>
