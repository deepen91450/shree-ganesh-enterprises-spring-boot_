<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" href="/css/navbar.css">

    <link rel="stylesheet" th:href="@{/css/signup.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">


</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
    <div class="signup-container">

        <h2>Sign Up</h2>

        <form th:action="@{/signup}" method="post" th:object="${user}">
            <input th:field="*{name}" placeholder="Full name" required />
            <input th:field="*{email}" placeholder="Email" required />
            <input th:field="*{phone}" placeholder="Phone"  pattern="[6-9][0-9]{9}"
                   title="Enter a valid 10-digit Indian mobile number" />
            <input th:field="*{password}" placeholder="Password" type="password" required />

            <button type="submit">Create account</button>
        </form>

        <a href="/login">Already have an account? Login</a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="/js/script.js"></script>

</body>
</html>
