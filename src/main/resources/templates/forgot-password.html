<!-- forgot-password.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot password</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="auth-box">
    <h2>Forgot password</h2>
    <p th:if="${param.sent}" style="color:green;text-align:center;">
        If the email exists, a reset link has been sent.
    </p>
    <p th:if="${param.rateLimited}" style="color:red;text-align:center;">
        Too many reset requests. Please wait and try again.
    </p>
    <form th:action="@{/forgot-password}" method="post">
        <input name="email" placeholder="Your registered email" required />
        <button type="submit">Send reset link</button>
    </form>
</div>
</body>
</html>
