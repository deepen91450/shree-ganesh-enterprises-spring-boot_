<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">

    <!-- In <head>, last CSS -->
    <link rel="stylesheet" href="/css/animations.css">

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">

    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">


</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
    <div class="login-box">

        <h2>Login</h2>

        <!-- ================= LOGIN MESSAGES ================= -->

        <!-- 🔒 BLOCKED USER -->

        <div th:if="${param.blocked}" class="message error">
            Your account has been blocked by admin.
            Please contact support.
        </div>

        <!-- ❌ INVALID LOGIN -->

        <div th:if="${param.error}" class="message error">
            Invalid email or password.
        </div>

        <!-- ⏳ RATE LIMITED -->

        <div th:if="${param.rateLimited}" class="message error">
            Too many attempts.
            Please wait a minute and try again.
        </div>

        <!-- ✅ LOGOUT -->

        <div th:if="${param.logout}" class="message success">
            You have been logged out successfully.
        </div>

        <form th:action="@{/login(redirect=${param.redirect})}" method="post" class="login-form">

            <!-- ✅ Carry redirect URL through form POST so success handler can read it -->
            <input type="hidden" name="redirect" th:value="${param.redirect}">

            <div class="form-row">
                <label>Email or phone</label>
                <input name="username" type="text" required placeholder="Email or phone">
            </div>

            <div class="form-row">
                <label>Password</label>
                <input name="password" type="password" required placeholder="Password">
            </div>

            <button type="submit">Login</button>

            <div class="links">
                <a th:href="@{/signup}">Create account</a> |
                <a th:href="@{/forgot-password}">Forgot password?</a>
            </div>
        </form>

        <div style="text-align:center;margin-top:10px;">
            <a th:href="@{/oauth2/authorization/google}">Login with Google 🔐</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="/js/script.js"></script>

</body>
</html>
