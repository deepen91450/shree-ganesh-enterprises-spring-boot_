spring.ai.model.chat=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2:3b}
spring.ai.ollama.chat.options.temperature=${OLLAMA_CHAT_TEMPERATURE:0.2}
spring.ai.ollama.chat.options.num-predict=${OLLAMA_CHAT_MAX_TOKENS:512}
spring.ai.ollama.init.pull-model-strategy=never
spring.http.client.connect-timeout=${OLLAMA_CONNECT_TIMEOUT:5s}
spring.http.client.read-timeout=${OLLAMA_READ_TIMEOUT:60s}
